[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Static files: the logo almost never changes, so browsers keep it for a week;
# styles and scripts are re-checked quickly so updates show up soon after a deploy.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
